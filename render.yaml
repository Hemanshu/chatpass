# Render Blueprint: free web service. Single instance (secrets live in memory).
services:
  - type: web
    name: chatpass
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_TTL_SECONDS
        value: "300"
